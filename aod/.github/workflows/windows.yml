name: Build Windows installer
on:
  push:
    paths: ["host/**", "installer/**"]
  workflow_dispatch:
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install dependencies
        working-directory: host
        run: |
          pip install -r requirements.txt pyinstaller
          pip install -r requirements-optional.txt
      - name: Build AOD.exe
        working-directory: host
        run: |
          python make_icon.py
          pyinstaller --noconfirm --onedir --noconsole --name AOD --icon icon.ico `
            --add-data "static;static" `
            --collect-all aiortc --collect-all av --collect-all soundcard `
            --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 `
            --hidden-import pystray._win32 `
            aod_host.py
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\aod.iss
      - uses: actions/upload-artifact@v4
        with:
          name: AOD-windows-installer
          path: installer/Output/AOD-Setup.exe
