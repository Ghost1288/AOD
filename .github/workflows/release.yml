name: Build and release
# Every push builds the Android app and the Windows installer and publishes them as a GitHub Release.
# The apps check that release and update themselves.
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
# Only the newest push gets built, so releases can never publish out of order.
concurrency:
  group: release
  cancel-in-progress: true
env:
  BUILD: ${{ github.run_number }}
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest psutil pillow cryptography
      - run: python -m pytest -q aod/tests
  android:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: gradle -p aod/android assembleRelease --no-daemon -PbuildNumber=${{ github.run_number }}
      - run: cp aod/android/app/build/outputs/apk/release/app-release.apk AOD.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: AOD.apk }

  windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Stamp version
        shell: bash
        run: printf 'VERSION = "2.0.%s"\nBUILD = %s\n' "$BUILD" "$BUILD" > aod/host/aod_version.py
      - name: Install dependencies
        working-directory: aod/host
        run: |
          pip install -r requirements.txt pyinstaller
      - name: Install optional extras (audio, fast capture, virtual gamepad)
        working-directory: aod/host
        continue-on-error: true
        timeout-minutes: 6
        run: |
          foreach ($p in Get-Content requirements-optional.txt) {
            $job = Start-Job { param($p) pip install --prefer-binary $p 2>&1 } -ArgumentList $p
            if (Wait-Job $job -Timeout 150) { Receive-Job $job | Select-Object -Last 3 | Write-Host } else { Stop-Job $job; Write-Host "optional $p timed out" }
          }
          pip show pywebview | Select-String "Version"
          $global:LASTEXITCODE = 0
      - name: Install vgamepad (its installer hangs on CI, so copy the package in by hand)
        working-directory: aod/host
        continue-on-error: true
        timeout-minutes: 4
        run: |
          $j = Invoke-RestMethod https://pypi.org/pypi/vgamepad/json
          $u = ($j.urls | Where-Object packagetype -eq 'bdist_wheel' | Select-Object -First 1).url
          if ($u) { pip install --no-deps $u } else {
            $u = ($j.urls | Where-Object packagetype -eq 'sdist' | Select-Object -First 1).url
            Invoke-WebRequest $u -OutFile vg.tgz; New-Item -ItemType Directory vg | Out-Null; tar xzf vg.tgz -C vg
            $src = Get-ChildItem vg -Recurse -Directory -Filter vgamepad | Where-Object { Test-Path "$($_.FullName)\__init__.py" } | Select-Object -First 1
            $site = python -c "import sysconfig;print(sysconfig.get_paths()['purelib'])"
            Copy-Item $src.FullName "$site\vgamepad" -Recurse -Force
          }
          pip install pyyaml
          python -c "import importlib.util;s=importlib.util.find_spec('vgamepad');print('vgamepad files:', s.origin if s else 'MISSING')"
          $global:LASTEXITCODE = 0
      - name: Build AOD.exe
        working-directory: aod/host
        run: |
          python make_icon.py
          $extra = @()
          foreach ($m in "soundcard","dxcam","vgamepad","webview","clr_loader","pythonnet") { python -c "import importlib.util,sys;sys.exit(0 if importlib.util.find_spec('$m') else 1)" 2>$null; if ($LASTEXITCODE -eq 0) { $extra += "--collect-all"; $extra += $m } }
          $global:LASTEXITCODE = 0
          pyinstaller --noconfirm --onedir --noconsole --name AOD --icon icon.ico `
            --add-data "static;static" `
            --collect-all aiortc --collect-all av @extra `
            --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 `
            --hidden-import pystray._win32 --hidden-import webview.platforms.edgechromium `
            aod_host.py
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" aod\installer\aod.iss
      - uses: actions/upload-artifact@v4
        with: { name: installer, path: aod/installer/Output/AOD-Setup.exe }

  release:
    needs: [android, windows]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { path: out, merge-multiple: true }
      - name: Package
        run: |
          mkdir -p out prev
          printf 'VERSION = "2.0.%s"\nBUILD = %s\n' "$BUILD" "$BUILD" > aod/host/aod_version.py
          (cd aod/host && zip -qr ../../out/aod-host.zip . -x ".venv/*" "*/__pycache__/*" "__pycache__/*" "dist/*" "build/*")
          # If one of the two builds failed, keep shipping the previous good file and its build number.
          gh release download --repo "$GITHUB_REPOSITORY" --pattern version.json --dir prev 2>/dev/null || true
          prev() { python3 -c "import json,sys;d=json.load(open('prev/version.json'));print(d.get(sys.argv[1],d.get('build',0)))" "$1" 2>/dev/null || echo 0; }
          APK_BUILD=$BUILD; EXE_BUILD=$BUILD
          if [ ! -f out/AOD.apk ]; then
            gh release download --repo "$GITHUB_REPOSITORY" --pattern AOD.apk --dir out 2>/dev/null && APK_BUILD=$(prev apk_build) || echo "no APK this build"
          fi
          if [ ! -f out/AOD-Setup.exe ]; then
            gh release download --repo "$GITHUB_REPOSITORY" --pattern AOD-Setup.exe --dir out 2>/dev/null && EXE_BUILD=$(prev exe_build) || echo "no EXE this build"
          fi
          printf '{"version":"2.0.%s","build":%s,"apk_build":%s,"exe_build":%s,"apk":"AOD.apk","exe":"AOD-Setup.exe","host_zip":"aod-host.zip"}\n' "$BUILD" "$BUILD" "$APK_BUILD" "$EXE_BUILD" > out/version.json
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AOD 2.0.${{ github.run_number }}
          make_latest: true
          files: |
            out/AOD.apk
            out/AOD-Setup.exe
            out/aod-host.zip
            out/version.json
